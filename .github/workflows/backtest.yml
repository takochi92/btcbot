name: backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["btcbot/**", "config.toml", "hypothesis.lock"]
permissions:
  contents: write
concurrency:
  group: state-writer
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m btcbot backtest
      - run: cat reports/backtest.md >> "$GITHUB_STEP_SUMMARY"
      - name: 結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ state/kill_criteria.json 2>/dev/null || git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "バックテスト結果を更新"
          git pull --rebase origin main
          git push origin HEAD:main
